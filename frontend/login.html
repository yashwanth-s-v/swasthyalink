<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login - AyurConnect</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<nav class="navbar">

    <a href="index.html" class="logo">
        Ayur<span>Connect</span>
    </a>

    <div class="nav-links">

        <a href="register.html"
           class="btn btn-primary">

            Create Account

        </a>

    </div>

</nav>

<main class="auth-page">

    <div class="auth-card">

        <h1>Welcome back</h1>

        <p>
            Sign in to continue to AyurConnect.
        </p>

        <div
            id="loginMessage"
            class="message">
        </div>

        <form id="loginForm">

            <div class="form-group">

                <label for="loginEmail">
                    Email
                </label>

                <input
                    id="loginEmail"
                    type="email"
                    placeholder="you@example.com"
                    required
                >

            </div>

            <div class="form-group">

                <label for="loginPassword">
                    Password
                </label>

                <input
                    id="loginPassword"
                    type="password"
                    placeholder="Enter your password"
                    required
                >

            </div>

            <button
                id="loginButton"
                type="submit"
                class="btn btn-primary full-btn">

                Login

            </button>

        </form>

        <p style="margin-top:20px;text-align:center;">

            Don't have an account?

            <a
                href="register.html"
                style="color:var(--primary);font-weight:700;">

                Register

            </a>

        </p>

    </div>

</main>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
