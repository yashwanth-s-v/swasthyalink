<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - AyurConnect</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<nav class="navbar">

    <a href="index.html" class="logo">
        Ayur<span>Connect</span>
    </a>

    <div class="nav-links">
        <a href="login.html">Already have an account?</a>
    </div>

</nav>

<main class="auth-page">

    <div class="auth-card">

        <h1>Create your account</h1>

        <p>
            Join AyurConnect as a patient or healthcare professional.
        </p>

        <div id="registerMessage" class="message"></div>

        <form id="registerForm">

            <div class="form-group">

                <label for="full_name">
                    Full Name
                </label>

                <input
                    id="full_name"
                    type="text"
                    placeholder="Enter your full name"
                    required
                >

            </div>

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    id="email"
                    type="email"
                    placeholder="you@example.com"
                    required
                >

            </div>

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    id="password"
                    type="password"
                    placeholder="Minimum 6 characters"
                    required
                >

            </div>

            <div class="form-group">

                <label for="role">
                    I am registering as
                </label>

                <select id="role">

                    <option value="patient">
                        Patient
                    </option>

                    <option value="doctor">
                        Doctor
                    </option>

                </select>

            </div>

            <button
                id="registerButton"
                type="submit"
                class="btn btn-primary full-btn">

                Create Account

            </button>

        </form>

        <p style="margin-top:20px;text-align:center;">

            Already have an account?

            <a
                href="login.html"
                style="color:var(--primary);font-weight:700;">

                Login

            </a>

        </p>

    </div>

</main>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
